name: Feature request
description: Suggest a capability or improvement for the starter.
title: "feat: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        This is a **starter template**, so the bar for new features is whether most
        projects built on it would want the thing. Highly app-specific features are
        usually better left to the project that clones this repo.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you hit, not the solution you have in mind.
      placeholder: |
        Every project I start from this template has to hand-roll file uploads to S3,
        because there is nothing under src/libs/ that handles storage at all.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        What would you add or change, and where does it live? Name the bucket or module —
        `src/libs/<bucket>/` for shared code (see `.claude/rules/shared-code.md`),
        `src/routes/<feature>/` plus `src/services/` for a feature.
      placeholder: |
        A `src/libs/storage/` bucket behind a new `@storage` alias, with a local-disk driver
        and an S3 driver selected by a STORAGE_DRIVER env var validated in
        src/libs/config/env.config.ts (envalid).
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area would this touch?
      multiple: true
      options:
        - Auth / JWT (login, register, verify, reset password, refresh, auth.plugin.ts)
        - RBAC (PermissionGuard, RoleGuard, route-level onRequest gating)
        - Database / Drizzle ORM / migrations (src/libs/database/postgres/)
        - Repositories (src/libs/database/postgres/repositories/)
        - Routes / services (src/routes/, src/services/)
        - Zod validation schemas (schema.ts)
        - i18n / locales (src/libs/i18n/)
        - Response envelope / ResponseToolkit / response-schema builders
        - OpenAPI docs (swagger.plugin.ts, Scalar at /docs)
        - Caching / Redis (SessionService, @cache)
        - Queues / mail (BullMQ, src/bull/)
        - Rate limiting / CORS / Helmet (externals plugins)
        - ClickHouse (optional analytics database)
        - DI container (tsyringe, di.plugin.ts)
        - Build / tooling / CI (bun build, eslint, prettier, husky)
        - Docker / deployment (Dockerfile, docker-compose.yml)
        - Documentation
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "do nothing and let each project solve it" — say why that is not enough.

  - type: checkboxes
    id: breaking
    attributes:
      label: Impact
      options:
        - label: This would be a breaking change for existing projects built on the template.
        - label: This adds a new dependency to package.json.
        - label: This adds or changes an environment variable (env.config.ts + .env.example).
        - label: I am willing to open a pull request for this.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
        - label: I checked the relevant rule in `.claude/rules/` to confirm this is not already covered.
          required: true
